<!doctype html>
<!-- Sumber gambar preview WhatsApp (1200x630). Buat ulang dengan: node tools/make-og.js v2 -->
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/v2/css/style.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative; width: 1200px; height: 630px; display: grid; place-items: center; text-align: center;
    color: var(--on-night);
    background:
      radial-gradient(50% 80% at 50% 45%, rgba(226, 178, 96, .22), transparent 70%),
      url("/assets/img/truntum-prada.svg") 0 0 / 64px,
      var(--night);
  }
  .og p { margin: 0; }
  .og .g { position: absolute; bottom: -60px; height: 620px; opacity: .4; }
  .og .g--l { left: -110px; transform: rotate(-6deg); }
  .og .g--r { right: -110px; transform: rotate(6deg); }
  .og .frame { position: absolute; inset: 22px; border: 1px solid rgba(201, 161, 91, .5); }
  .og .frame::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(201, 161, 91, .22); }
  .og .c { position: relative; }
  .og .t { font-size: 22px; font-weight: 500; letter-spacing: .4em; text-transform: uppercase; color: var(--on-night-soft); }
  .og .n { margin-top: 18px; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 104px; line-height: 1; }
  .og .n .amp { font-size: .5em; }
  .og .a { margin-top: 10px; font-size: 30px; }
  .og .d { margin-top: 14px; font-size: 26px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; }
  .og .v { margin-top: 12px; font-size: 22px; color: var(--on-night-soft); }
</style>
</head>
<body>
  <div class="og">
    <div class="frame"></div>
    <img class="g g--l" src="/assets/img/gunungan-prada.svg" alt="">
    <img class="g g--r" src="/assets/img/gunungan-prada.svg" alt="">
    <div class="c">
      <p class="t">The Wedding of</p>
      <p class="n"><span class="prada-text">Cahaya</span> <span class="amp">&amp;</span> <span class="prada-text">Hammam</span></p>
      <p class="aksara a">꧋ꦕꦲꦪ ꦭꦤ꧀ ꦲꦩ꧀ꦩꦩ꧀꧉</p>
      <p class="d">Minggu, 29 November 2026</p>
      <p class="v">ndalem Tjokrosukarnan, Surakarta</p>
    </div>
  </div>
</body>
</html>
